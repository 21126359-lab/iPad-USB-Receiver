name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure project.yml exists
        run: |
          cat << 'EOF' > project.yml
          name: iPadReceiver
          targets:
            iPadReceiver:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [App]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.display.ipadreceiver
                INFOPLIST_KEY_UILaunchScreen_Generation: true
                CODE_SIGNING_ALLOWED: NO
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild build \
            -project iPadReceiver.xcodeproj \
            -scheme iPadReceiver \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/iPadReceiver.app Payload/
          zip -r iPadReceiver.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPadReceiver-IPA
          path: iPadReceiver.ipa
