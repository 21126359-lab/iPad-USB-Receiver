name: iPadReceiver
options:
  xcodeVersion: "15.4"
  objectVersion: 56
targets:
  iPadReceiver:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources: [App]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.display.ipadreceiver
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      CODE_SIGNING_ALLOWED: NO
